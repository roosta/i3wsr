[icons]
# font awesome
TelegramDesktop = ""
firefox = ""
Alacritty = ""
Termite = ""
Thunderbird = ""
Gpick = ""
Nautilus = "📘"
# smile emoji
MyNiceProgram = "😛"

# i3 / Xwayland
[aliases.class]
TelegramDesktop = "Telegram"
"Org\\.gnome\\.Nautilus" = "Nautilus"

# Sway only
[aliases.app_id]
"^firefox$" = "Firefox"

# i3 only
[aliases.instance]
"open.spotify.com" = "Spotify"

# Both i3 and sway
[aliases.name]

[general]
separator = "  "
split_at = ":"
empty_label = "🌕"
factorize_notation = "chemist"
display_property = "instance" # class, instance, name
default_icon = ""

[options]
remove_duplicates = false
factorize = false
no_names = false
no_icon_names = false
focus_fix = false
